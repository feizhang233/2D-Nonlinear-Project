[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "general-nonlinear-shell-math"
version = "0.2.0"
description = "Verification-oriented Python math core for the General Nonlinear Shell guide"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["general_nonlinear_shell_math*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["UP045"]
